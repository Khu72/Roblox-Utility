# Self-contained single-file Windows EXE (win-x64). No .NET install needed on the player's PC.
# Artifact: zip containing R-Util/ with RobloxUtility.exe (and any sidecar files the host extracts).
# Tag builds attach the zip to the GitHub Release.
name: Build portable (self-contained)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained single file)
        run: >
          dotnet publish RobloxUtility/RobloxUtility.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false
          -p:PublishTrimmed=false
          -o "${{ github.workspace }}/staging/R-Util"

      - uses: actions/upload-artifact@v6
        with:
          name: RobloxUtility-win-x64-self-contained
          path: ${{ github.workspace }}/staging

      - name: Zip (for release attachment only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}/staging/R-Util" -DestinationPath "${{ github.workspace }}/RobloxUtility-win-x64-self-contained.zip" -Force

      - name: Attach to GitHub Release (when tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: RobloxUtility-win-x64-self-contained.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
