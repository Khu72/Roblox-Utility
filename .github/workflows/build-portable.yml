# Produces a self-contained Windows build: no .NET SDK or runtime needed on the player's PC.
# Workflow artifact is a zip whose root contains one folder, R-Util/, with all publish outputs inside.
# For tag builds, a release zip is attached to the GitHub Release page (same layout).
name: Build portable (self-contained)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained)
        run: >
          dotnet publish RobloxUtility/RobloxUtility.csproj
          -c Release -r win-x64
          -p:PublishSingleFile=true -p:SelfContained=true
          -o "${{ github.workspace }}/staging/R-Util"

      - uses: actions/upload-artifact@v6
        with:
          name: RobloxUtility-win-x64-self-contained
          path: ${{ github.workspace }}/staging

      - name: Zip (for release attachment only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}/staging/R-Util" -DestinationPath "${{ github.workspace }}/RobloxUtility-win-x64-self-contained.zip" -Force

      - name: Attach to GitHub Release (when tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: RobloxUtility-win-x64-self-contained.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
